services:
  roller:
    image: roller:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - TZ=UTC
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8
      - STORAGE_ROOT=/usr/local/roller/data
      - DATABASE_JDBC_DRIVERCLASS=${DATABASE_JDBC_DRIVERCLASS:-org.postgresql.Driver}
      - DATABASE_JDBC_CONNECTIONURL=${DATABASE_JDBC_CONNECTIONURL:?set DATABASE_JDBC_CONNECTIONURL}
      - DATABASE_JDBC_USERNAME=${DATABASE_JDBC_USERNAME:?set DATABASE_JDBC_USERNAME}
      - DATABASE_JDBC_PASSWORD=${DATABASE_JDBC_PASSWORD:?set DATABASE_JDBC_PASSWORD}
      - AUTHENTICATION_METHOD=${AUTHENTICATION_METHOD:-db}
      - MAIL_HOSTNAME=${MAIL_HOSTNAME}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_PORT=${MAIL_PORT}
      - LDAP_HOST=${LDAP_HOST}
      - LDAP_PORT=${LDAP_PORT}
      - LDAP_DC=${LDAP_DC}
      - LDAP_OU=${LDAP_OU}
      - LDAP_SECURITY_LEVEL=${LDAP_SECURITY_LEVEL}
      - IPBANLIST_FILE=${IPBANLIST_FILE}
      - UPLOADS_DIR=${UPLOADS_DIR}
    volumes:
      - roller-data:/usr/local/roller/data
      - roller-logs:/opt/tomcat/logs

volumes:
  roller-data:
  roller-logs:
