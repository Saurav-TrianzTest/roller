services:

  roller:
    build: .
    image: roller:latest
    ports:
      - "8080:8080"
    environment:
      - STORAGE_ROOT=/usr/local/tomcat/data
      - DATABASE_JDBC_DRIVERCLASS=${DATABASE_JDBC_DRIVERCLASS:-org.postgresql.Driver}
      - DATABASE_JDBC_CONNECTIONURL=${DATABASE_JDBC_CONNECTIONURL:-jdbc:postgresql://postgresql:5432/rollerdb}
      - DATABASE_JDBC_USERNAME=${DATABASE_JDBC_USERNAME:-scott}
      - DATABASE_JDBC_PASSWORD=${DATABASE_JDBC_PASSWORD:?set DATABASE_JDBC_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST:-postgresql:5432}
      - AUTHENTICATION_METHOD=${AUTHENTICATION_METHOD:-db}
      - OIDC_ISSUER_URI=${OIDC_ISSUER_URI}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_PROVIDER_ID=${OIDC_PROVIDER_ID:-keycloak}
      - OIDC_CLIENT_NAME=${OIDC_CLIENT_NAME:-Keycloak}
      - OIDC_AUTO_PROVISION=${OIDC_AUTO_PROVISION:-true}
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
      - TZ=UTC
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    volumes:
      - roller-data:/usr/local/tomcat/data
      - roller-logs:/usr/local/tomcat/logs

volumes:
  roller-data:
  roller-logs:
