# Cloud migration configuration
# Database settings (read from environment, with old values as defaults)
DB_HOST=localhost
DB_PORT=3306
DB_NAME=rollerdb
DB_USER=rollerdb

# AWS configuration
AWS_REGION=us-east-1

# S3 bucket for file storage (cr-java-0061, cr-java-0062, cr-java-0063, cr-java-0112)
APP_S3_BUCKET=roller-media-files
APP_S3_KEY_PREFIX=media/
APP_S3_TEMP_PREFIX=temp/

# Secrets Manager secret name for database credentials (cr-java-0069, cr-java-0113)
DB_SECRET_NAME=roller/database/credentials

# Parameter Store path for properties (cr-java-0070)
APP_PARAMETER_PATH=/roller/config/

# Redis for session state (cr-java-0065)
ELASTICACHE_ENDPOINT=localhost
REDIS_PASSWORD=

# Spring Session Redis configuration (cr-java-0065)
spring.session.store-type=redis
spring.session.timeout=1800s
spring.session.redis.namespace=spring:session
spring.session.redis.flush-mode=on_save
spring.data.redis.host=${ELASTICACHE_ENDPOINT:localhost}
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=false
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5

# DynamoDB table for singleton state (cr-java-0068)
APP_DYNAMODB_TABLE=roller-app-state

# Embedded Tomcat
server.port=${PORT:8080}
